<!doctype html>
<html lang="en">
  <head>
    <script>
      // In cloud container preview environments, HMR websocket connections are disabled
      if (typeof window !== 'undefined') {
        const _origConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.join(' ');
          if (msg.includes('[vite]') && (msg.includes('connect') || msg.includes('websocket') || msg.includes('ws://') || msg.includes('wss://'))) {
            return;
          }
          return _origConsoleError.apply(this, args);
        };
      }
    </script>
