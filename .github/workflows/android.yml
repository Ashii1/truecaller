name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Build web assets
        run: npm run build
      - run: rm -rf app/src/main/assets && mkdir -p app/src/main/assets && cp -R dist/. app/src/main/assets/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"
      - name: Configure CI release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.VIGILSHIELD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VIGILSHIELD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIGILSHIELD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VIGILSHIELD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vigilshield-release.jks"
            test -s "$RUNNER_TEMP/vigilshield-release.jks"
            echo "Using protected production signing key from secrets."
          elif [ -f "release-keystore.jks" ]; then
            echo "Using persistent release-keystore.jks (matches installed app certificate)."
            cp "release-keystore.jks" "$RUNNER_TEMP/vigilshield-release.jks"
            KEYSTORE_PASSWORD="vigilshield123"
            KEY_ALIAS="vigilshield-key"
            KEY_PASSWORD="vigilshield123"
          elif [ -f "keystore_base64.txt" ]; then
            echo "Decoding persistent keystore_base64.txt (matches installed app certificate)."
            base64 -d keystore_base64.txt > "$RUNNER_TEMP/vigilshield-release.jks"
            KEYSTORE_PASSWORD="vigilshield123"
            KEY_ALIAS="vigilshield-key"
            KEY_PASSWORD="vigilshield123"
          else
            echo "Decoding embedded persistent release keystore (matches installed app certificate)."
            cat << 'EOF' | base64 --decode > "$RUNNER_TEMP/vigilshield-release.jks"

EOF
            KEYSTORE_PASSWORD="vigilshield123"
            KEY_ALIAS="vigilshield-key"
            KEY_PASSWORD="vigilshield123"
          fi
          {
            echo "VIGILSHIELD_KEYSTORE_FILE=$RUNNER_TEMP/vigilshield-release.jks"
            echo "VIGILSHIELD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "VIGILSHIELD_KEY_ALIAS=$KEY_ALIAS"
            echo "VIGILSHIELD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signature and version
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          test -n "$APK"
          echo "Built $APK"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK"
            apksigner verify --print-certs "$APK"
          fi
          echo "Expected applicationId: com.vigilshield.telecom"
          echo "Expected CI versionCode: ${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@v4
        with:
          name: vigilshield-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
